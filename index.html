
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebolzin Hoje ⚽</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            background: linear-gradient(135deg, #0f172a, #14532d, #15803d);
            position:relative;
        }

        /* bolinhas decorativas */
        body::before,
        body::after{
            content:"";
            position:absolute;
            width:400px;
            height:400px;
            border-radius:50%;
            filter: blur(80px);
            opacity:0.4;
        }

        body::before{
            background:#22c55e;
            top:-100px;
            left:-100px;
        }

        body::after{
            background:#38bdf8;
            bottom:-100px;
            right:-100px;
        }

        .container{
            width:90%;
            max-width:700px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:30px;
            padding:50px;
            text-align:center;
            color:white;
            box-shadow:0 0 40px rgba(0,0,0,0.4);
            position:relative;
            z-index:2;
            animation: aparecer 1s ease;
        }

        @keyframes aparecer{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        h1{
            font-size:3rem;
            margin-bottom:20px;
            text-shadow:0 0 20px rgba(255,255,255,0.4);
        }

        .bola{
            font-size:70px;
            animation:girar 4s linear infinite;
            margin-bottom:20px;
        }

        @keyframes girar{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }

        p{
            font-size:1.4rem;
            margin-bottom:35px;
            color:#d1fae5;
        }

        .botoes{
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
        }

        button{
            border:none;
            padding:18px 40px;
            font-size:1.3rem;
            font-weight:bold;
            border-radius:18px;
            cursor:pointer;
            transition:0.3s;
            color:white;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .sim{
            background: linear-gradient(45deg, #22c55e, #16a34a);
        }

        .nao{
            background: linear-gradient(45deg, #ef4444, #dc2626);
        }

        button:hover{
            transform:scale(1.1) translateY(-5px);
            box-shadow:0 15px 35px rgba(0,0,0,0.5);
        }

        #resultado{
            margin-top:40px;
            font-size:2rem;
            font-weight:bold;
            min-height:50px;
            animation: brilho 2s infinite alternate;
        }

        @keyframes brilho{
            from{
                text-shadow:0 0 10px rgba(255,255,255,0.3);
            }
            to{
                text-shadow:0 0 25px rgba(255,255,255,0.8);
            }
        }

        .decoracao{
            position:absolute;
            font-size:30px;
            animation: flutuar 5s infinite ease-in-out;
            opacity:0.8;
        }

        @keyframes flutuar{
            0%{
                transform:translateY(0px);
            }
            50%{
                transform:translateY(-20px);
            }
            100%{
                transform:translateY(0px);
            }
        }

        .d1{ top:10%; left:10%; }
        .d2{ top:20%; right:15%; }
        .d3{ bottom:15%; left:20%; }
        .d4{ bottom:10%; right:10%; }

    </style>
</head>
<body>

    <div class="decoracao d1">⚽</div>
    <div class="decoracao d2">🔥</div>
    <div class="decoracao d3">🏆</div>
    <div class="decoracao d4">⚡</div>

    <div class="container">
        <div class="bola">⚽</div>

        <h1>FUTEBOLZIN HOJE?</h1>

        <p>Bora jogar ou vai ficar moscando? 😎</p>

        <div class="botoes">
            <button class="sim" onclick="respostaSim()">SIM</button>
            <button class="nao" onclick="respostaNao()">NÃO</button>
        </div>

        <div id="resultado"></div>
    </div>

    <script>
        function respostaSim(){
            document.getElementById("resultado").innerHTML = "🔥 VC É BRABO MLK 🔥";
        }

        function respostaNao(){
            document.getElementById("resultado").innerHTML = "🤨 CHAPOU MN 🤨";
        }
    </script>

</body>
</html>
