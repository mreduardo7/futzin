
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Futebolzin do Ney ⚽🔥</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at top, rgba(0, 255, 170, 0.15), transparent 40%),
                radial-gradient(circle at bottom, rgba(0, 140, 255, 0.15), transparent 40%),
                linear-gradient(135deg, #020617, #07111f, #001d3d);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ESTÁDIO */

        .stadium {
            position: absolute;
            bottom: -80px;
            width: 120%;
            height: 280px;
            background:
                radial-gradient(circle at center, #16a34a 0%, #14532d 60%, #0b3b1c 100%);
            border-radius: 50%;
            filter: blur(2px);
            opacity: .8;
        }

        .lights {
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(to right,
                    transparent 0 120px,
                    rgba(255, 255, 255, 0.04) 120px 130px);
            opacity: .25;
        }

        /* PARTÍCULAS */

        .particles span {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            animation: subir linear infinite;
            opacity: .7;
        }

        @keyframes subir {
            from {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(-120vh) scale(1);
                opacity: 0;
            }
        }

        /* CARD */

        .container {
            width: 92%;
            max-width: 850px;
            padding: 55px;
            border-radius: 35px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 5;
            overflow: hidden;
            box-shadow:
                0 0 25px rgba(0, 255, 170, 0.15),
                0 0 80px rgba(0, 140, 255, 0.08),
                inset 0 0 20px rgba(255, 255, 255, 0.03);
            animation: entrada 1.2s ease;
        }

        @keyframes entrada {
            from {
                opacity: 0;
                transform: scale(.8) translateY(50px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .shine {
            position: absolute;
            top: -200%;
            left: -100%;
            width: 300%;
            height: 300%;
            background:
                linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.08),
                    transparent);
            transform: rotate(20deg);
            animation: shine 8s linear infinite;
        }

        @keyframes shine {
            from {
                left: -200%;
            }

            to {
                left: 200%;
            }
        }

        /* NEYMAR PASSANDO */

        .neymar {
            position: absolute;
            bottom: 110px;
            left: -350px;
            width: 220px;
            z-index: 3;
            animation: correr 14s linear infinite;
            filter:
                drop-shadow(0 0 25px rgba(0, 255, 255, .7));
        }

        @keyframes correr {
            0% {
                left: -350px;
                transform: scaleX(1);
            }

            49% {
                transform: scaleX(1);
            }

            50% {
                left: 110%;
                transform: scaleX(-1);
            }

            99% {
                transform: scaleX(-1);
            }

            100% {
                left: -350px;
                transform: scaleX(1);
            }
        }

        /* TITULO */

        h1 {
            text-align: center;
            font-size: 4.2rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 18px;

            background:
                linear-gradient(90deg,
                    #00f7ff,
                    #00ff88,
                    #ffffff,
                    #00f7ff);

            background-size: 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: gradient 6s linear infinite;
        }

        @keyframes gradient {
            from {
                background-position: 0%;
            }

            to {
                background-position: 400%;
            }
        }

        .sub {
            text-align: center;
            color: #d8faff;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        /* BOTÕES */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 20px 45px;
            border-radius: 22px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: .4s;
            color: white;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(120deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent);

            transform: translateX(-100%);
            transition: .6s;
        }

        button:hover::before {
            transform: translateX(100%);
        }

        button:hover {
            transform: translateY(-10px) scale(1.08);
        }

        .sim {
            background:
                linear-gradient(45deg, #00ff88, #00c46d);

            box-shadow:
                0 0 20px rgba(0, 255, 136, .6),
                0 0 50px rgba(0, 255, 136, .4);
        }

        .nao {
            background:
                linear-gradient(45deg, #ff004c, #c00039);

            box-shadow:
                0 0 20px rgba(255, 0, 76, .6),
                0 0 50px rgba(255, 0, 76, .4);
        }

        /* RESULTADO */

        #resultado {
            text-align: center;
            margin-top: 40px;
            min-height: 60px;
            font-size: 2.1rem;
            font-weight: 800;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        /* BARRA */

        .loading {
            width: 100%;
            height: 12px;
            border-radius: 30px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 35px;
        }

        .loading span {
            display: block;
            height: 100%;
            width: 100%;
            background:
                linear-gradient(90deg,
                    #00f7ff,
                    #00ff88,
                    #00f7ff);

            background-size: 300%;
            animation: gradient 3s linear infinite;
        }

        /* RESPONSIVO */

        @media(max-width:700px) {

            h1 {
                font-size: 2.6rem;
            }

            .container {
                padding: 35px 22px;
            }

            .neymar {
                width: 150px;
                bottom: 130px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="lights"></div>

    <div class="stadium"></div>

    <!-- Neymar -->
    <img class="neymar"
        src="200w.gif">
    <!-- partículas -->
    <div class="particles" id="particles"></div>

    <div class="container">

        <div class="shine"></div>

        <h1>FUTEBOLZIN<br>HOJE?</h1>

        <p class="sub">
            Neymar já confirmou presença 😮‍💨⚽
        </p>

        <div class="buttons">

            <button class="sim" onclick="sim()">
                SIM 🔥
            </button>

            <button class="nao" onclick="nao()">
                NÃO 🤨
            </button>

        </div>

        <div id="resultado"></div>

        <div class="loading">
            <span></span>
        </div>

    </div>

    <audio autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            type="audio/mp3">
    </audio>

    <script>

        // PARTÍCULAS

        const particles = document.getElementById('particles');

        for (let i = 0; i < 120; i++) {

            const span = document.createElement('span');

            span.style.left = Math.random() * window.innerWidth + 'px';

            span.style.animationDuration =
                (Math.random() * 10 + 5) + 's';

            span.style.opacity =
                Math.random();

            span.style.width =
                span.style.height =
                (Math.random() * 4 + 2) + 'px';

            particles.appendChild(span);
        }

        // BOTÕES

        function sim() {

            document.getElementById('resultado')
                .innerHTML =
                '🔥 VC É BRABO MLK 🔥';

            chuva('⚽');
        }

        function nao() {

            document.getElementById('resultado')
                .innerHTML =
                '🤨 CHAPOU MN 🤨';

            document.body.style.animation =
                'shake .4s';

            setTimeout(() => {
                document.body.style.animation = '';
            }, 400);

            chuva('😂');
        }

        // CHUVA

        function chuva(emoji) {

            for (let i = 0; i < 35; i++) {

                const el = document.createElement('div');

                el.innerHTML = emoji;

                el.style.position = 'absolute';
                el.style.left =
                    Math.random() * window.innerWidth + 'px';

                el.style.top = '-50px';

                el.style.fontSize =
                    (Math.random() * 30 + 20) + 'px';

                el.style.animation =
                    'fall 4s linear forwards';

                el.style.zIndex = '999';

                document.body.appendChild(el);

                setTimeout(() => {
                    el.remove();
                }, 4000);
            }
        }

        // ANIMAÇÕES DINÂMICAS

        const style = document.createElement('style');

        style.innerHTML = `

        @keyframes fall{

            from{
                transform:translateY(0) rotate(0deg);
                opacity:1;
            }

            to{
                transform:translateY(120vh) rotate(720deg);
                opacity:0;
            }

        }

        @keyframes shake{

            0%{transform:translateX(0);}
            20%{transform:translateX(-10px);}
            40%{transform:translateX(10px);}
            60%{transform:translateX(-10px);}
            80%{transform:translateX(10px);}
            100%{transform:translateX(0);}

        }

        `;

        document.head.appendChild(style);

    </script>

</body>

</html>
